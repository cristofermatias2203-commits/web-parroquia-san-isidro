<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-labelledby="pcTitle">
  <title id="pcTitle">Pastoral de Comunicación - Parroquia San Isidro Labrador</title>
  <defs>
    <linearGradient id="pcBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a96dc"/>
      <stop offset="1" stop-color="#04629c"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Ondas de transmisión (amarillo del logo) -->
    <path d="M72 30c9 9 9 23 0 32" fill="none" stroke="#f0c010" stroke-width="5" stroke-linecap="round"/>
    <path d="M83 21c15 15 15 37 0 52" fill="none" stroke="#f0c010" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <path d="M94 12c21 21 21 52 0 73" fill="none" stroke="#f0c010" stroke-width="5" stroke-linecap="round" opacity=".45"/>

    <!-- Micrófono -->
    <rect x="35" y="30" width="18" height="34" rx="9" fill="url(#pcBlue)"/>
    <path d="M28 54a16 16 0 0 0 32 0" fill="none" stroke="url(#pcBlue)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M44 70v11" stroke="url(#pcBlue)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M32 84h24" stroke="url(#pcBlue)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Arco de comunicación (azul del logo) -->
    <path d="M4 88C14 58 40 38 72 38" fill="none" stroke="#0080c8" stroke-width="4.5" stroke-linecap="round" opacity=".9"/>
    <path d="M10 100c12-32 40-52 72-54" fill="none" stroke="#0080c8" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  </g>

  <text x="118" y="53" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2.6" fill="#04629c">PASTORAL DE</text>
  <text x="118" y="83" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="0.6" fill="#f0c010">COMUNICACIÓN</text>
  <text x="118" y="103" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="8.6" letter-spacing="1.5" fill="#5c7d92">PARROQUIA SAN ISIDRO LABRADOR</text>
</svg>
