name: CI y despliegue

on:
  push:
    branches: [main, rewrite/astro-typescript]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Comprobaciones (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El lockfile incluye binarios nativos opcionales (issue #13):
        # comprobamos que la instalación funciona en los tres sistemas.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Verificar tipos, i18n, datos del Evangelio y PWA
        run: bun run check

  build:
    name: Build del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Comprobar y generar dist/
        run: |
          bun run check
          bun run build
      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Publicar en GitHub Pages
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite/astro-typescript'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
